<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ارائه خروجی‌های شاخص فشار اقلیمی محیطی</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-side-by-side/leaflet-side-by-side.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <h1>ارائه خروجی‌های شاخص فشار اقلیمی محیطی</h1>
        <p>Environmental Climate Pressure Index Outputs Dashboard</p>
      </div>
    </header>

    <main class="dashboard-grid">
      <section class="panel control-panel">
        <h2>کنترل لایه‌ها</h2>

        <label for="yearSelect">انتخاب سال / سناریو</label>
        <select id="yearSelect"></select>

        <label for="compareLeft">مقایسه - لایه چپ</label>
        <select id="compareLeft"></select>

        <label for="compareRight">مقایسه - لایه راست</label>
        <select id="compareRight"></select>

        <button id="compareToggle">فعال‌سازی مقایسه کشویی</button>

        <div class="legend-box">
          <h3>راهنمای طبقات</h3>
          <ul id="legendList"></ul>
        </div>

        <div class="summary-box">
          <h3>خلاصه لایه</h3>
          <div id="layerSummary">در حال بارگذاری...</div>
        </div>
      </section>

      <section class="panel map-panel">
        <div class="panel-title-row">
          <h2>نمایش مکانی شاخص</h2>
          <span id="activeLayerLabel" class="badge">-</span>
        </div>
        <div id="map"></div>
      </section>

      <section class="panel chart-panel">
        <h2>روند تغییرات کلاس‌ها</h2>
        <canvas id="trendChart"></canvas>
      </section>

      <section class="panel stats-panel">
        <h2>مساحت و درصد طبقات</h2>
        <div class="stats-layout">
          <div class="table-wrap">
            <table id="statsTable">
              <thead>
                <tr>
                  <th>طبقه</th>
                  <th>مساحت (km²)</th>
                  <th>درصد</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <div class="pie-wrap">
            <canvas id="pieChart"></canvas>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/georaster"></script>
  <script src="https://unpkg.com/georaster-layer-for-leaflet"></script>
  <script src="https://unpkg.com/leaflet-side-by-side"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
